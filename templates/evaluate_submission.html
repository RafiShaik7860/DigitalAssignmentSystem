<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluate Submission - AssignEval</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav>
        <h2>AssignEval</h2>
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>

    <main>

        <h1>Evaluate Student Assignment</h1>

        <h3>{{ submission.assignment.title }}</h3>

        <p>
            <strong>Student:</strong>
            {{ submission.student.username }}
        </p>

        <p>
            <strong>Subject:</strong>
            {{ submission.assignment.subject }}
        </p>

        <p>
            <strong>Maximum Marks:</strong>
            {{ submission.assignment.max_marks }}
        </p>

        <form method="POST">

            <label for="marks">Enter Marks</label>

            <input
                type="number"
                id="marks"
                name="marks"
                min="0"
                max="{{ submission.assignment.max_marks }}"
                required
            >

            <br><br>

            <label for="feedback">Faculty Feedback</label>

            <textarea
                id="feedback"
                name="feedback"
                rows="5"
                required
            ></textarea>

            <br><br>

            <button type="submit">
                Submit Evaluation
            </button>

        </form>

    </main>

</body>
</html>
